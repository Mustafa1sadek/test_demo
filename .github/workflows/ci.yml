name: CI

on: 
  push:
    branches:
    - main

  pull_request:
    branches:
    - main  


jobs:
  
  test:
    name: unit test
    runs-on: ubuntu-latest

    steps:

    - name: checkout
      uses: actions/checkout@v2

    - name: set up
      uses: actions/setup-node@v2
      with: 
        node-version: 24
      
    - name: install dependencies
      run: npm i

    - name: run unit test
      run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: checkout
      uses: actions/checkout@v2

    - name: set up
      uses: actions/setup-node@v2
      with: 
        node-version: 24
      
    - name: install dependencies
      run: npm i
 
    - name: run build
      run: npm run build




